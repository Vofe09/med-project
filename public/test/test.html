<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Прохождение теста</title>
  <link rel="stylesheet" href="test-style.css" />
</head>
<body>

<header>
  <nav>
    <a href="https://unit-med.vercel.app/" class="lighter">О нас</a>
    <a href="https://med-forum-2.vercel.app/forum">Форум</a>
    <a href="https://unit-med.vercel.app/conference/index.html">Конференции</a>
    <a href="https://unit-med.vercel.app/materials/index.html">Материалы</a>
    <a href="https://unit-med.vercel.app/test/index.html">Тесты</a>
  </nav>
</header>

<div class="content">
  <div class="test-wrapper">
    <!-- ❗ ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ -->
    <h1 id="test-title" class="page-title"></h1>

    <form id="test-form"></form>

    <button id="submitBtn" class="btn wide">
      Проверить
    </button>

    <div id="result" class="result-box"></div>
  </div>
</div>

<footer class="footer">
  MED.UNIT — 2025
</footer>


<script>
let codeGenerated = false;

function generateCode(len = 20) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < len; i++) {
    out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}

async function loadTest() {
  const url = new URL(window.location.href);
  const id = url.searchParams.get("id");

  const res = await fetch("tests.json");
  const data = await res.json();

  const test = data.tests.find(t => t.id === id);

  if (!test) {
    document.querySelector(".test-wrapper").innerHTML =
      "<h2>Тест не найден</h2>";
    return;
  }

  document.getElementById("test-title").innerText = test.title;

  const form = document.getElementById("test-form");
  form.innerHTML = "";

  test.questions.forEach((q, qi) => {
    const block = document.createElement("div");
    block.className = "question-card";

    let html = `<p class='q-title'>${qi + 1}. ${q.q}</p>`;

    q.answers.forEach((ans, ai) => {
      html += `
        <label class="answer-option">
          <input type="radio" name="q${qi}" value="${ai}">
          ${ans}
        </label>
      `;
    });

    block.innerHTML = html;
    form.appendChild(block);
  });

  document.getElementById("submitBtn").onclick = async function () {
    let correctCount = 0;

    test.questions.forEach((q, qi) => {
      const chosen = form.querySelector(`input[name="q${qi}"]:checked`);
      const block = form.querySelectorAll(".question-card")[qi];

      block.querySelectorAll(".your-answer, .correct-answer, .explanation")
        .forEach(el => el.remove());

      let userAnswerText = chosen
        ? q.answers[parseInt(chosen.value)]
        : "Не выбран";

      let correctAnswerText = q.answers[q.correct];

      if (chosen && parseInt(chosen.value) === q.correct) {
        correctCount++;
        const span = document.createElement("p");
        span.className = "your-answer correct-answer";
        span.innerText = `Ваш ответ: ${userAnswerText} ✅`;
        block.appendChild(span);
      } else {
        const your = document.createElement("p");
        your.className = "your-answer wrong-answer";
        your.innerText = `Ваш ответ: ${userAnswerText}`;
        block.appendChild(your);

        const correctSpan = document.createElement("p");
        correctSpan.className = "correct-answer";
        correctSpan.innerText = `Правильный ответ: ${correctAnswerText}`;
        block.appendChild(correctSpan);
      }

      const explanation = document.createElement("p");
      explanation.className = "explanation";
      explanation.innerText = q.explanation;
      block.appendChild(explanation);
    });

    const total = test.questions.length;
    const percent = correctCount / total;

    const resultBox = document.getElementById("result");
    resultBox.innerHTML =
      `Ваш результат: <b>${correctCount}</b> из <b>${total}</b>`;

    // ✅ ПРОХОЖДЕНИЕ ≥ 70%
    if (percent >= 0.7 && !codeGenerated) {
      codeGenerated = true;

      const code = generateCode();

      await fetch("https://med-forum-2.vercel.app/api/test-code/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });

      const btn = document.createElement("button");
      btn.className = "btn wide";
      btn.style.marginTop = "20px";
      btn.innerText = "Записать результат в профиль";

      btn.onclick = () => {
        window.location.href =
          `https://med-forum-2.vercel.app/profile?test_code=${code}`;
      };

      resultBox.appendChild(document.createElement("br"));
      resultBox.appendChild(btn);
    }
  };
}

loadTest();
</script>
</body>
</html>
